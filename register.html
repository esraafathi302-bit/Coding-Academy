<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF‑8">
    <title>Register - Coding Academy</title>

</head>
<body>

<main class="main-section">
    <div class="form-box">
        <h2 class="neon">Register</h2>

        </form>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
