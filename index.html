<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF‑8">
    <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
    <title>Coding Academy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <img src="https://i.postimg.cc/jqnk1BCk/Screenshot.png" class="logo" alt="Logo">
    <h1 class="title">Coding Academy</h1>
</header>

<main class="main-section">
    <h2 class="neon">Learn Programming From Zero To Professional</h2>

    <form class="user-form">
        <label for="level">Select Your Level:</label>
        <select id="level" name="level">
            <option>Beginner</option>
            <option>Intermediate</option>
            <option>Advanced</option>
        </select>

        <label for="age">Enter Your Age:</label>
        <input type="number" id="age" name="age" placeholder="Enter your age" min="5" max="100">

        <button type="submit" class="btn">Submit</button>
    </form>

    <div class="nav-buttons">
        <a href="courses.html" class="btn">Courses</a>
        <a href="login.html" class="btn">Login</a>
    </div>
</main>

</footer>

</html>
